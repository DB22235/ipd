# ==============================================================================
# Potato Student Baseline Model Training Configuration
# MobileNetV3-Large Supervised Baseline with Ultra-Fast In-Memory RAM Caching
# ==============================================================================

crop: potato
model_role: student_baseline
architecture: MobileNetV3Large
input_size: [224, 224, 3]
backend: tensorflow
preload: true

# Training Hyperparameters
batch_size: 32
seed: 42
warmup_epochs: 3
max_epochs: 30
early_stopping_patience: 6
learning_rate: 0.0001
weight_decay: 0.0001
dropout_rate: 0.25
class_weights: inverse_frequency

# Data & Model Paths
split_manifest: manifests/potato/potato_split_manifest_v1.csv
output_dir: models/potato/student_baselines/run_001
